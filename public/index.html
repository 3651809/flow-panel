<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>流量面板</title>
<style>
  :root{
    --bg:#f1f3f6; --panel:#fff; --panel-2:#fafbfc;
    --line:#e6e9ee; --line-2:#dbe0e7;
    --text:#111827; --muted:#6b7280; --faint:#9aa3ae;
    --brand:#1a56db; --brand-soft:#eef3fe;
    --ok:#12a150; --warn:#e08700; --crit:#d92d20; --unknown:#a3acb8;
    --track:#e9edf2;
    --hero-1:#e7effd; --hero-2:#f3f7ff; --hero-3:#fbfcff; --hero-line:#e3e9f4;
    --sh:0 1px 2px rgba(16,24,40,.04), 0 4px 14px rgba(16,24,40,.06);
    --sh-lg:0 2px 4px rgba(16,24,40,.05), 0 12px 28px rgba(16,24,40,.1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --panel:#161b22; --panel-2:#1b212a;
      --line:#242c37; --line-2:#333d49;
      --text:#e6eaf0; --muted:#98a2b3; --faint:#6c7887;
      --brand:#4f86f7; --brand-soft:#15233a;
      --ok:#3fb950; --warn:#d29922; --crit:#f85149; --unknown:#5c6673;
      --track:#232b36;
      --hero-1:#121a29; --hero-2:#111827; --hero-3:#0d1219; --hero-line:#1e2836;
      --sh:0 1px 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.3);
      --sh-lg:0 2px 4px rgba(0,0,0,.4), 0 12px 28px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 56px}

  /* --------------------------------------------------------- 顶部横幅 */
  .hero{background:linear-gradient(118deg,var(--hero-1) 0%,var(--hero-2) 46%,var(--hero-3) 100%);border-bottom:1px solid var(--hero-line)}
  .hero-in{max-width:1180px;margin:0 auto;padding:20px 24px 16px}
  .hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hero h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
  .hero .stamp{font-size:12.5px;color:var(--muted)}
  .hero .grow{flex:1;min-width:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(18,161,80,.14)}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(224,135,0,.14)}
  .dot.crit{background:var(--crit);box-shadow:0 0 0 4px rgba(217,45,32,.14)}

  .btn{
    height:34px;padding:0 15px;font:inherit;font-size:13px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line-2);background:var(--panel);color:var(--text);
    box-shadow:0 1px 2px rgba(16,24,40,.05);transition:border-color .15s,box-shadow .15s,filter .15s;
  }
  .btn:hover{border-color:var(--faint);box-shadow:0 2px 6px rgba(16,24,40,.08)}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(26,86,219,.28)}
  .btn.pri:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent;box-shadow:none}
  .btn.danger{color:var(--crit);border-color:var(--crit)}
  .btn.danger:hover{background:rgba(217,45,32,.08)}
  .btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px;box-shadow:none}
  .btn:disabled{opacity:.5;cursor:not-allowed;filter:none}

  .hero-kpis{display:flex;gap:34px;flex-wrap:wrap;margin-top:14px}
  .hk .k{font-size:12px;color:var(--muted)}
  .hk .v{font-size:22px;font-weight:650;letter-spacing:-.02em;line-height:1.35}
  .hk .v small{font-size:12px;font-weight:400;color:var(--faint);margin-left:2px}
  .hk .v.zero{color:var(--faint);font-weight:500}
  .hk .v.warn{color:var(--warn)}
  .hk .v.crit{color:var(--crit)}

  /* --------------------------------------------------------- 筛选 */
  .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:20px 0 16px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    height:31px;padding:0 13px;border-radius:9px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12.5px;
    box-shadow:0 1px 1px rgba(16,24,40,.03);transition:border-color .15s,color .15s,background .15s;
  }
  .chip:hover{border-color:var(--faint);color:var(--text)}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(26,86,219,.25)}
  .chip i{width:6px;height:6px;border-radius:50%;display:block}
  .chip .n{opacity:.7;font-size:11.5px}
  .filters .grow{flex:1}
  .filters .hint{font-size:12px;color:var(--faint)}

  /* --------------------------------------------------------- 卡片 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .card{
    position:relative;display:flex;gap:16px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;box-shadow:var(--sh);
    transition:transform .16s,box-shadow .16s,border-color .16s;
  }
  .card:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--line-2)}
  .card.s-warn{border-color:rgba(224,135,0,.35)}
  .card.s-crit{border-color:rgba(217,45,32,.35)}

  .donut{
    --p:0; --c:var(--ok);
    position:relative;width:94px;height:94px;flex:none;border-radius:50%;
    background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--track) 0);
    display:grid;place-items:center;
  }
  .donut::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--panel)}
  .donut .in{position:relative;z-index:1;text-align:center;line-height:1.1}
  .donut .in b{font-size:19px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .donut .in span{display:block;font-size:10.5px;color:var(--faint);margin-top:2px;white-space:nowrap}
  .donut.na{background:repeating-conic-gradient(var(--track) 0 12deg,var(--panel-2) 12deg 24deg)}

  .info{min-width:0;flex:1}
  /* 徽标绝对定位在右上角，名字右侧要留出它的宽度，否则长实例名会被压住 */
  .info .nm{
    font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.4;padding-right:56px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .info .rg{font-size:11.5px;color:var(--faint);margin-top:2px;display:flex;align-items:center;gap:6px;min-width:0}
  .info .rg i{width:6px;height:6px;border-radius:2px;display:block;flex:none}
  .info .rg span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .amt{margin-top:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .badge{
    position:absolute;top:13px;right:14px;
    font-size:11px;line-height:1;padding:4px 9px;border-radius:99px;
    border:1px solid var(--line);color:var(--muted);background:var(--panel);
  }
  .badge.b-ok{color:var(--ok);border-color:rgba(18,161,80,.28);background:rgba(18,161,80,.07)}
  .badge.b-warn{color:var(--warn);border-color:rgba(224,135,0,.3);background:rgba(224,135,0,.08)}
  .badge.b-crit{color:var(--crit);border-color:rgba(217,45,32,.3);background:rgba(217,45,32,.08)}

  /* --------------------------------------------------------- 面板 */
  .panel{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
  .panel .ph{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .panel .ph h2{margin:0;font-size:13.5px;font-weight:600}
  .panel .ph .grow{flex:1}
  .panel .ph .hint{font-size:12px;color:var(--faint)}
  .panel .pb{padding:16px 18px}
  .hint{font-size:12px;color:var(--faint)}
  .req{color:var(--crit);font-weight:600}
  .fhelp{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.45}

  /* --------------------------------------------------------- 表格 */
  .tablewrap{overflow-x:auto}
  tbody.hide-domain .col-domain{display:none}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{
    text-align:left;font-weight:500;font-size:11.5px;color:var(--faint);
    padding:9px 18px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:10px 18px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--panel-2)}
  td.dim{color:var(--muted)}
  td.nowrap{white-space:nowrap}
  td.actions{text-align:right;white-space:nowrap}
  td.actions .btn{margin-left:6px}
  .tname{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:6px;vertical-align:middle}
  td code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px}
  .cell-err{color:var(--crit);font-size:11.5px;max-width:240px;white-space:normal;margin-top:3px}
  .hbar{width:96px;height:5px;border-radius:99px;background:var(--track);overflow:hidden;display:inline-block;vertical-align:middle}
  .hbar i{display:block;height:100%;border-radius:99px}
  .pill{display:inline-flex;align-items:center;font-size:11.5px;line-height:1;padding:4px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:rgba(18,161,80,.28);background:rgba(18,161,80,.07)}
  .pill.warn{color:var(--warn);border-color:rgba(224,135,0,.3);background:rgba(224,135,0,.08)}
  .pill.crit{color:var(--crit);border-color:rgba(217,45,32,.3);background:rgba(217,45,32,.08)}

  /* --------------------------------------------------------- 表单 */
  .formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  input,select{
    font:inherit;font-size:13px;height:35px;padding:0 10px;width:100%;
    border:1px solid var(--line-2);border-radius:9px;background:var(--panel);color:var(--text);
    transition:border-color .15s,box-shadow .15s;
  }
  input::placeholder{color:var(--faint)}
  input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,219,.16)}
  input:disabled,select:disabled{background:var(--panel-2);color:var(--muted);cursor:not-allowed}
  .actions-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap;align-items:center}

  /* --------------------------------------------------------- 采集端点 */
  .endpoint{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
  .endpoint:last-child{border-bottom:none;padding-bottom:0}
  .endpoint code{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;word-break:break-all}
  .endpoint .hint{flex:1;min-width:140px}
  /* 按钮文字会在「复制 / 已复制」之间切换，给个最小宽度避免跳动 */
  .endpoint .btn{min-width:62px}

  /* --------------------------------------------------------- 空状态 / 骨架 */
  .empty{color:var(--muted);font-size:13px;padding:28px 16px;text-align:center;border:1px dashed var(--line-2);border-radius:12px}
  .empty strong{display:block;font-weight:600;color:var(--text);margin-bottom:4px}
  .empty .btn{margin-top:12px}
  .skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
  .skeleton div{height:126px;border-radius:14px;background:linear-gradient(90deg,var(--line) 25%,var(--panel-2) 37%,var(--line) 63%);background-size:400% 100%;animation:shimmer 1.3s ease-in-out infinite}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}

  /* --------------------------------------------------------- toast */
  .toast{
    position:fixed;right:20px;bottom:20px;z-index:50;
    display:flex;align-items:flex-start;gap:9px;
    max-width:min(460px,calc(100vw - 40px));
    padding:11px 14px;border-radius:11px;
    background:var(--panel);color:var(--text);border:1px solid var(--line);
    box-shadow:var(--sh-lg);font-size:13px;
    opacity:0;transform:translateY(8px);
    transition:opacity .18s,transform .18s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--brand);flex:none}
  .toast.err::before{background:var(--crit)}
  .toast.ok::before{background:var(--ok)}

  @media (max-width:720px){
    .wrap{padding:0 14px 40px}
    .hero-in{padding:16px 14px 14px}
    .hero-kpis{gap:22px}
    .grid,.skeleton{grid-template-columns:1fr}
    .filters{margin:16px 0 14px}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <span class="dot" id="statusDot"></span>
      <h1>云主机流量</h1>
      <span class="stamp" id="stamp"></span>
      <span class="grow"></span>
      <button class="btn" id="btnRefresh">刷新</button>
      <button class="btn pri" id="btnCollect">立即采集</button>
    </div>
    <div class="hero-kpis" id="hkpis"></div>
  </div>
</div>

<div class="wrap">
  <div class="filters" id="filters"></div>
  <div id="grid"></div>

  <div class="panel">
    <div class="ph">
      <h2>实例明细</h2>
      <span class="grow"></span>
      <span class="hint" id="detailHint"></span>
    </div>
    <div class="tablewrap">
      <table style="min-width:960px">
        <thead>
          <tr>
            <th>实例</th><th>云厂商</th><th>账号</th><th>区域</th><th>用途</th>
            <th>剩余</th><th>用量</th><th>周期结束</th>
          </tr>
        </thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="ph">
      <h2>账号</h2>
      <span class="hint">AK 只存密文，界面只显示首尾 4 位</span>
      <span class="grow"></span>
      <button class="btn sm" id="btnAdd">新增账号</button>
    </div>
    <div class="tablewrap">
      <table style="min-width:900px">
        <thead>
          <tr><th>名称</th><th>云厂商</th><th>区域</th><th id="thDomain">账号 ID</th><th>AK</th><th>阈值 %</th><th>状态</th><th style="text-align:right">操作</th></tr>
        </thead>
        <tbody id="accountsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="formSection" style="display:none">
    <div class="ph"><h2 id="formTitle">新增账号</h2><span class="grow"></span><span class="hint" id="formHint"></span></div>
    <div class="pb">
      <form id="accountForm">
        <input type="hidden" id="f_id">
        <div class="formgrid">
          <div>
            <label for="f_provider">云厂商</label>
            <select id="f_provider"></select>
          </div>
          <div>
            <label for="f_name">名称</label>
            <input id="f_name" placeholder="主账号" required>
          </div>
          <div>
            <label for="f_slug">标识 slug</label>
            <input id="f_slug" placeholder="main" pattern="[a-z0-9][a-z0-9-]{0,31}" required>
          </div>
          <div id="dynFields" style="display:contents"></div>
          <div>
            <label for="f_warn">预警阈值 %</label>
            <input id="f_warn" type="number" min="0" max="100" placeholder="留空用全局">
          </div>
          <div>
            <label for="f_crit">严重阈值 %</label>
            <input id="f_crit" type="number" min="0" max="100" placeholder="留空用全局">
          </div>
          <div>
            <label for="f_ak">AK</label>
            <input id="f_ak" autocomplete="off" placeholder="编辑时留空表示不修改">
          </div>
          <div>
            <label for="f_sk">SK</label>
            <input id="f_sk" type="password" autocomplete="new-password" placeholder="编辑时留空表示不修改">
          </div>
        </div>
        <div class="actions-row">
          <button class="btn pri" type="submit" id="btnSave">保存</button>
          <button type="button" class="btn ghost" id="btnCancel">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>采集设置</h2><span class="grow"></span><span class="hint">保存后下一轮采集生效，不用重启</span></div>
    <div class="pb">
      <form id="settingsForm">
        <div class="formgrid">
          <div>
            <label for="s_interval">采集间隔（分钟，最小 5）</label>
            <input id="s_interval" type="number" min="5" max="1440">
          </div>
          <div>
            <label for="s_warn">全局预警阈值 %（剩余低于）</label>
            <input id="s_warn" type="number" min="0" max="100">
          </div>
          <div>
            <label for="s_crit">全局严重阈值 %（剩余低于）</label>
            <input id="s_crit" type="number" min="0" max="100">
          </div>
          <div>
            <label for="s_keep">历史保留（天）</label>
            <input id="s_keep" type="number" min="7" max="365">
          </div>
        </div>
        <div class="actions-row">
          <button class="btn pri" type="submit">保存设置</button>
        </div>
      </form>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>采集端点</h2></div>
    <div class="pb">
      <p class="hint" style="margin:0 0 10px">
        供外部监控拉取，无需鉴权（仅内网）。数据来自库里的定时采集结果，拉再频繁也不消耗云 API 配额。
      </p>
      <div id="pullList"></div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>最近采集</h2><span class="grow"></span><span class="hint" id="runsHint"></span></div>
    <div class="tablewrap">
      <table style="min-width:700px">
        <thead><tr><th>开始</th><th>结束</th><th>结果</th><th>条数</th><th>说明</th></tr></thead>
        <tbody id="runsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;
let firstLoad = true;
/* 筛选状态：{ type: 'all' | 'provider' | 'alerts', id }。刷新数据时不重置，用户选的筛选要留着。 */
let filter = { type: 'all', id: null };

const LEVEL_TEXT = { ok: '正常', warn: '预警', crit: '严重', unknown: '无数据' };
const LEVEL_RANK = { crit: 0, warn: 1, unknown: 2, ok: 3 };
/* 厂商色只用于小方块标识，不参与状态判断；未知厂商给中性灰 */
const PROV_COLOR = { huawei: '#E8262D', tencent: '#0052D9' };

function provColor(id) {
  return PROV_COLOR[id] || '#8c96a3';
}

function esc(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function toast(msg, kind, ms) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast' + (kind ? ' ' + kind : ''); }, ms || 2800);
}

function toDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d.getTime()) ? null : d;
}

/** 绝对时间：2026-11-19 10:32；short=true 时省略当年年份 */
function fmtTime(iso, short) {
  const d = toDate(iso);
  if (!d) return iso ? String(iso) : '-';
  const p = (n) => String(n).padStart(2, '0');
  const md = p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  if (short) return d.getFullYear() === new Date().getFullYear() ? md : d.getFullYear() + '-' + md;
  return d.getFullYear() + '-' + md;
}

/** 只到日期：2026-12-01。周期结束是日期概念，带上时分反而让人以为那是精确时刻 */
function fmtDate(iso) {
  const d = toDate(iso);
  if (!d) return iso ? String(iso) : '-';
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function fmtAgo(iso) {
  const d = toDate(iso);
  if (!d) return '-';
  const diff = Date.now() - d.getTime();
  if (diff < 6e4) return '刚刚';
  if (diff < 36e5) return Math.floor(diff / 6e4) + ' 分钟前';
  if (diff < 864e5) return Math.floor(diff / 36e5) + ' 小时前';
  return Math.floor(diff / 864e5) + ' 天前';
}

function fmtIn(iso) {
  const d = toDate(iso);
  if (!d) return '-';
  const diff = d.getTime() - Date.now();
  if (diff <= 0) return '即将执行';
  if (diff < 36e5) return '约 ' + Math.max(1, Math.round(diff / 6e4)) + ' 分钟后';
  return '约 ' + Math.round(diff / 36e5) + ' 小时后';
}

function fmtNum(n) {
  if (n === null || n === undefined || n === '') return '-';
  const v = Number(n);
  return Number.isFinite(v) ? String(Math.round(v * 100) / 100) : '-';
}

function providerTitle(id) {
  const p = (state.providers || []).find((x) => x.id === id);
  return p ? p.title : id;
}

/* 已用量百分比：后端在采集时就算好并落在 usedPct，这里只做边界收敛 */
function usedPctOf(it) {
  const v = Number(it.usedPct);
  if (it.usedPct === null || it.usedPct === undefined || !Number.isFinite(v)) return null;
  return Math.max(0, Math.min(100, v));
}

function alertCounts() {
  const items = state.snapshots || [];
  return {
    all: items.length,
    warn: items.filter((i) => i.alertLevel === 'warn').length,
    crit: items.filter((i) => i.alertLevel === 'crit').length
  };
}

function visibleItems() {
  const items = state.snapshots || [];
  if (filter.type === 'provider') return items.filter((i) => i.provider === filter.id);
  if (filter.type === 'alerts') return items.filter((i) => i.alertLevel === 'warn' || i.alertLevel === 'crit');
  return items;
}

/* ---------------------------------------------------------------- 顶部 */

function renderHero() {
  const items = state.snapshots || [];
  const { warn, crit } = alertCounts();
  const run = state.lastRun;
  const failed = Boolean(run && !run.ok);

  $('hkpis').innerHTML = [
    { k: '监控实例', v: items.length, u: '台', cls: items.length ? '' : ' zero' },
    { k: '严重告警', v: crit, u: '项', cls: crit ? ' crit' : ' zero' },
    { k: '预警', v: warn, u: '项', cls: warn ? ' warn' : ' zero' }
  ].map((x) =>
    '<div class="hk"><div class="k">' + x.k + '</div>' +
    '<div class="v num' + x.cls + '">' + x.v + '<small>' + x.u + '</small></div></div>'
  ).join('');

  const c = state.collector || {};
  const bits = [];
  if (run) {
    bits.push('采集于 ' + fmtAgo(run.finished_at || run.started_at));
    bits.push((run.ok ? '成功' : '有失败') + '，' + (run.item_count || 0) + ' 项');
  } else {
    bits.push('尚未采集');
  }
  bits.push('每 ' + (c.intervalMin || '-') + ' 分钟自动采集');
  if (c.nextRunAt) bits.push('下次' + fmtIn(c.nextRunAt));
  if (c.running) bits.push('正在采集');
  $('stamp').textContent = bits.join(' · ');
  $('stamp').title = run
    ? fmtTime(run.finished_at || run.started_at) + (run.message ? ' · ' + run.message : '')
    : '还没有采集记录';

  const accounts = state.accounts || [];
  const enabled = accounts.filter((a) => a.enabled).length;
  $('statusDot').className = 'dot ' + (crit || failed ? 'crit' : warn ? 'warn' : items.length ? 'ok' : '');
  $('statusDot').title =
    accounts.length + ' 个账号' + (enabled !== accounts.length ? '（' + enabled + ' 个启用）' : '');
}

/* ---------------------------------------------------------------- 筛选 */

function renderFilters() {
  const items = state.snapshots || [];
  const { all } = alertCounts();
  const chips = [];

  chips.push(chipHtml('all', null, '全部', all, ''));

  for (const p of state.providers || []) {
    const n = items.filter((i) => i.provider === p.id).length;
    chips.push(chipHtml('provider', p.id, p.title, n, provColor(p.id)));
  }

  const alerts = items.filter((i) => i.alertLevel === 'warn' || i.alertLevel === 'crit').length;
  chips.push(chipHtml('alerts', null, '只看告警', alerts, ''));

  const box = $('filters');
  box.innerHTML = chips.join('') +
    '<span class="grow"></span>' +
    '<span class="hint" id="thresholdHint"></span>';

  box.querySelectorAll('[data-f]').forEach((el) => {
    const pick = () => {
      const type = el.dataset.f;
      filter = { type, id: type === 'provider' ? el.dataset.p : null };
      renderFilters();
      renderCards();
      renderDetail();
    };
    el.onclick = pick;
    el.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
    };
  });

  const s = state.settings || {};
  const th = $('thresholdHint');
  if (th) {
    th.textContent = '剩余低于 ' + s.warn_remaining_pct + '% 预警、' + s.crit_remaining_pct + '% 严重';
  }
}

function chipHtml(type, id, label, count, color) {
  const on = filter.type === type && (type !== 'provider' || filter.id === id);
  return '<span class="chip' + (on ? ' on' : '') + '" data-f="' + type + '"' +
    (id ? ' data-p="' + esc(id) + '"' : '') + ' role="button" tabindex="0">' +
    (color ? '<i style="background:' + color + '"></i>' : '') +
    esc(label) + ' <span class="n">' + count + '</span></span>';
}

/* ---------------------------------------------------------------- 卡片 */

function renderCards() {
  const box = $('grid');
  const all = state.snapshots || [];

  if (!all.length) {
    box.innerHTML =
      '<div class="empty">' +
      '<strong>还没有采集数据</strong>' +
      '账号启用后点「立即采集」，或者等下一轮定时任务。' +
      ((state.accounts || []).length ? '' : '<br>目前还没有配置账号。') +
      '<br><button class="btn pri" id="btnEmptyCollect">立即采集</button>' +
      '</div>';
    const b = $('btnEmptyCollect');
    if (b) b.onclick = () => $('btnCollect').click();
    return;
  }

  const list = visibleItems().slice().sort((a, b) => {
    const ra = LEVEL_RANK[a.alertLevel] === undefined ? 9 : LEVEL_RANK[a.alertLevel];
    const rb = LEVEL_RANK[b.alertLevel] === undefined ? 9 : LEVEL_RANK[b.alertLevel];
    if (ra !== rb) return ra - rb;
    return (usedPctOf(b) || 0) - (usedPctOf(a) || 0);
  });

  if (!list.length) {
    box.innerHTML = '<div class="empty"><strong>这个筛选下没有实例</strong>点上面的「全部」看完整列表。</div>';
    return;
  }

  box.innerHTML = '<div class="grid">' + list.map(cardHtml).join('') + '</div>';
}

/* 卡片右下那行说明。后端偶尔只给余量不给总量（资源包拿不到 original），
   这种时候不要拼出「共 - GB」，缺哪项就不说哪项。 */
function amtLine(it, known, pct) {
  if (!known) return '未查到流量包';
  const parts = [];
  if (pct !== null) parts.push('已用 ' + pct + '%');
  if (it.original !== null && it.original !== undefined) {
    parts.push('共 ' + fmtNum(it.original) + (it.unit ? ' ' + esc(it.unit) : ''));
  }
  return parts.join(' · ') || '—';
}

function cardHtml(it) {
  const known = it.amount !== null && it.amount !== undefined;
  const pct = usedPctOf(it);
  /* 后端只会给 ok/warn/crit/unknown，但这里是渲染入口，未知值一律按无数据画，别把 undefined 打到界面上 */
  const lvl = LEVEL_TEXT[it.alertLevel] ? it.alertLevel : 'unknown';
  const level = lvl === 'unknown' ? '' : lvl;
  const color = { crit: 'var(--crit)', warn: 'var(--warn)', ok: 'var(--ok)' }[level] || 'var(--unknown)';
  const name = it.instanceName || it.resourceId || '(未命名)';
  const sub = [providerTitle(it.provider), it.accountName].filter(Boolean).join(' · ');

  /* 圆环按「已用」比例填充，中心给绝对余量：环快满 = 快用完，与中心数字说的是同一件事。
     如果中心也放百分比，会和环的填充方向互相打架。 */
  const donut = known
    ? '<div class="donut" style="--p:' + (pct === null ? 0 : pct) + ';--c:' + color + '">' +
        '<div class="in"><b>' + fmtNum(it.amount) + '</b><span>' + esc(it.unit || '') + ' 剩余</span></div>' +
      '</div>'
    : '<div class="donut na"><div class="in"><b style="color:var(--faint)">—</b></div></div>';

  const badge = lvl === 'unknown'
    ? '<span class="badge">无数据</span>'
    : '<span class="badge b-' + lvl + '">' + LEVEL_TEXT[lvl] + '</span>';

  return '<article class="card s-' + (level || 'unknown') + '">' +
    donut +
    '<div class="info">' +
      '<div class="nm" title="' + esc(name) + '">' + esc(name) + '</div>' +
      '<div class="rg"><i style="background:' + provColor(it.provider) + '"></i>' +
        '<span title="' + esc(sub) + '">' + esc(sub) + '</span></div>' +
      '<div class="amt">' + amtLine(it, known, pct) + '</div>' +
    '</div>' +
    badge +
  '</article>';
}

/* ---------------------------------------------------------------- 明细表 */

function renderDetail() {
  const body = $('detailBody');
  const all = state.snapshots || [];
  const list = visibleItems();

  $('detailHint').textContent = all.length
    ? (list.length === all.length ? '共 ' + all.length + ' 项' : list.length + ' / ' + all.length + ' 项')
    : '';

  if (!list.length) {

  body.innerHTML = list.map((it) => {

    const pct = usedPctOf(it);

    const color = { crit: 'var(--crit)', warn: 'var(--warn)', ok: 'var(--ok)' }[level] || 'var(--unknown)';
    const name = it.instanceName || it.resourceId || '(未命名)';
    const region = it.extra && it.extra.region ? it.extra.region : '-';

    return '<tr>' +
      '<td class="tname" title="' + esc(name) + '">' + esc(name) + '</td>' +
      '<td class="dim nowrap"><i class="pv" style="background:' + provColor(it.provider) + '"></i>' +
        esc(providerTitle(it.provider)) + '</td>' +
      '<td class="dim nowrap">' + esc(it.accountName || '-') + '</td>' +
      '<td class="dim nowrap">' + esc(region) + '</td>' +
      '<td class="dim nowrap">' + esc(it.usageType || '-') + '</td>' +
      '<td class="nowrap">' + (known ? fmtNum(it.amount) + ' <span style="color:var(--faint)">' + esc(it.unit || '') + '</span>' : '<span style="color:var(--faint)">-</span>') + '</td>' +
      '<td class="nowrap">' +
        '<span class="hbar"><i style="width:' + (pct === null ? 0 : pct) + '%;background:' + color + '"></i></span>' +
        '<span class="num" style="margin-left:9px;color:var(--muted)">' + (pct === null ? '-' : pct + '%') + '</span>' +
      '</td>' +
      '<td class="dim nowrap" title="' + esc(it.cycleEnd || '') + '">' +

/* ---------------------------------------------------------------- 账号 */

function renderAccounts() {
  const body = $('accountsBody');
  const accounts = state.accounts || [];
  /* 账号 ID 只有华为云用得到；一个都没填时整列收起来，不留一竖排的「-」 */
  const showDomain = accounts.some((a) => a.domainId);
  $('thDomain').style.display = showDomain ? '' : 'none';
  body.classList.toggle('hide-domain', !showDomain);
  if (!accounts.length) {
    body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--faint);padding:22px">还没有账号，点右上「新增账号」添加。</td></tr>';
    return;
  }
  body.innerHTML = accounts.map((a) => {
    const warn = a.warnPct === null || a.warnPct === undefined ? '-' : a.warnPct;
    const crit = a.critPct === null || a.critPct === undefined ? '-' : a.critPct;
    return '<tr>' +
      '<td class="nowrap"><b style="font-weight:600">' + esc(a.name) + '</b>' +
        '<div class="hint">' + esc(a.slug) + '</div></td>' +
      '<td class="nowrap">' + esc(providerTitle(a.provider)) + '</td>' +
      '<td class="nowrap">' + esc(a.region || '-') + '</td>' +
      '<td class="nowrap col-domain">' + esc(a.domainId || '-') + '</td>' +
      '<td class="nowrap"><code>' + esc(a.akMasked || '-') + '</code></td>' +
      '<td class="nowrap">' + esc(warn) + ' / ' + esc(crit) + '</td>' +
      '<td class="nowrap">' +
        (a.enabled ? '<span class="pill ok">启用</span>' : '<span class="pill">停用</span>') +
        (a.lastError ? '<div class="cell-err" title="' + esc(a.lastError) + '">' + esc(a.lastError) + '</div>' : '') +
      '</td>' +
      '<td class="actions">' +
        '<button class="btn sm" data-act="test">测试</button>' +
        '<button class="btn sm" data-act="edit">编辑</button>' +
        '<button class="btn sm" data-act="toggle">' + (a.enabled ? '停用' : '启用') + '</button>' +
        '<button class="btn sm danger" data-act="del">删除</button>' +
      '</td>' +
    '</tr>';
  }).join('');

  /* 按行索引回取账号对象，不把 id 拼进 HTML 再解析 */
  Array.from(body.querySelectorAll('tr')).forEach((tr, idx) => {
    const a = accounts[idx];
    if (!a) return;
    tr.querySelectorAll('[data-act]').forEach((btn) => {
      btn.onclick = () => {
        const act = btn.dataset.act;
        if (act === 'test') testAccount(a.id);
        else if (act === 'edit') openForm(a);
        else if (act === 'toggle') toggleAccount(a);
        else if (act === 'del') removeAccount(a);
      };
    });
  });
}

function renderSettings() {
  /* 60 秒自动刷新会重跑这里。用户正在改设置时不要用服务端值覆盖他手上的输入，
     否则刚敲的数字会自己跳回去。 */
  const active = document.activeElement;
  if (active && active.closest && active.closest('#settingsForm')) return;

  const s = state.settings || {};
  $('s_interval').value = s.collect_interval_min;
  $('s_warn').value = s.warn_remaining_pct;
  $('s_crit').value = s.crit_remaining_pct;
  $('s_keep').value = s.keep_days;
}

/* ---------------------------------------------------------------- 端点 */

function renderPull() {
  const base = location.origin;
  const rows = [
    [base + '/pull', 'Prometheus 文本，全部厂商'],
    [base + '/pull?format=json', 'JSON，按厂商分组']
  ];
  for (const p of state.providers || []) {
    rows.push([base + '/pull/' + p.id, '只看 ' + p.title + (p.ready ? '' : '（尚未接入）')]);
  }

  $('pullList').innerHTML = rows.map(([url, desc]) =>
    '<div class="endpoint">' +
      '<code>' + esc(url) + '</code>' +
      '<span class="hint">' + esc(desc) + '</span>' +
      '<button class="btn sm" data-copy="' + esc(url) + '">复制</button>' +
    '</div>'
  ).join('');

  $('pullList').querySelectorAll('[data-copy]').forEach((btn) => {
    btn.onclick = () => copyText(btn.dataset.copy, btn);
  });
}

function copyText(text, btn) {
  const done = () => {
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => { btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

/* http:// 内网地址不算安全上下文，clipboard API 用不了，退回 execCommand */
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
  document.body.removeChild(ta);
  if (ok) done();
  else toast('复制失败，请手动选中地址', 'err');
}

/* ---------------------------------------------------------------- 采集记录 */

function renderRuns() {
  const rows = state.runs || [];
  $('runsHint').textContent = rows.length ? '最近 ' + rows.length + ' 次' : '';
  $('runsBody').innerHTML = rows.length
    ? rows.map((r) =>
        '<tr>' +
        '<td class="nowrap" title="' + esc(fmtTime(r.started_at)) + '">' + esc(fmtTime(r.started_at, true)) + '</td>' +
        '<td class="nowrap" title="' + esc(fmtTime(r.finished_at)) + '">' + (r.finished_at ? esc(fmtTime(r.finished_at, true)) : '<span class="hint">未结束</span>') + '</td>' +
        '<td class="nowrap">' + (r.ok ? '<span class="pill ok">成功</span>' : '<span class="pill crit">有失败</span>') + '</td>' +
        '<td class="nowrap">' + (r.item_count || 0) + '</td>' +
        '<td class="dim" style="white-space:normal;max-width:420px">' + esc(r.message || '') + '</td>' +
        '</tr>'
      ).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--faint);padding:22px">还没有采集记录</td></tr>';

/* ---------------------------------------------------------------- 加载 */

async function load() {
  if (firstLoad) {
    $('grid').innerHTML = '<div class="skeleton"><div></div><div></div><div></div></div>';
  }

  const [stateRes, runsRes] = await Promise.all([
    fetch('/api/state', { cache: 'no-store' }),
    fetch('/api/runs?limit=15', { cache: 'no-store' }).catch(() => null)
  ]);
  if (!stateRes.ok) throw new Error('接口返回 ' + stateRes.status);

  state = await stateRes.json();
  state.runs = [];
  if (runsRes && runsRes.ok) {
    try {
      const j = await runsRes.json();
      state.runs = j.runs || [];
    } catch (_) { state.runs = []; }
  }

  renderHero();
  renderFilters();
  renderCards();
  renderDetail();
  renderAccounts();
  renderSettings();
  renderPull();
  renderRuns();
  firstLoad = false;
}

/* ---------------------------------------------------------------- 账号表单 */

function providerOptions() {
  $('f_provider').innerHTML = (state.providers || [])
    .map((p) => '<option value="' + esc(p.id) + '"' + (p.ready ? '' : ' disabled') + '>' +
      esc(p.title) + (p.ready ? '' : '（未接入）') + '</option>')
    .join('');
}

/* 区域 / 账号ID 这些每家不一样的字段由 provider 自己声明，换厂商时输入框跟着换 */
function renderProviderFields(providerId, account) {
  const p = (state.providers || []).find((x) => x.id === providerId);
  const fields = (p && p.fields) || [];
  $('dynFields').innerHTML = fields.map((f) => {
    const v = account && account[f.key] !== null && account[f.key] !== undefined ? String(account[f.key]) : '';
    return '<div>' +
      '<label for="dyn_' + esc(f.key) + '">' + esc(f.label) +
        (f.required ? ' <span class="req" title="必填">*</span>' : '') + '</label>' +
      '<input id="dyn_' + esc(f.key) + '" data-key="' + esc(f.key) + '"' +
        (f.required ? ' required' : '') +
        ' placeholder="' + esc(f.placeholder || '') + '" value="' + esc(v) + '">' +
      (f.help ? '<div class="fhelp">' + esc(f.help) + '</div>' : '') +
      '</div>';
  }).join('');
}

function openForm(account) {
  providerOptions();
  $('formSection').style.display = 'block';
  $('formTitle').textContent = account ? '编辑账号' : '新增账号';
  $('formHint').textContent = account ? 'AK / SK 留空表示不修改' : '';
  $('f_id').value = account ? account.id : '';
  const firstReady = (state.providers || []).find((p) => p.ready);
  $('f_provider').value = account ? account.provider : firstReady ? firstReady.id : '';
  $('f_provider').disabled = Boolean(account);
  $('f_name').value = account ? account.name : '';
  $('f_slug').value = account ? account.slug : '';
  renderProviderFields($('f_provider').value, account);
  $('f_warn').value = account && account.warnPct !== null ? account.warnPct : '';
  $('f_crit').value = account && account.critPct !== null ? account.critPct : '';
  $('f_ak').value = '';
  $('f_sk').value = '';
  $('formSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function saveAccount(e) {
  e.preventDefault();
  const id = $('f_id').value;
  const payload = {
    provider: $('f_provider').value,
    name: $('f_name').value.trim(),
    slug: $('f_slug').value.trim(),
    warnPct: $('f_warn').value === '' ? null : Number($('f_warn').value),
    critPct: $('f_crit').value === '' ? null : Number($('f_crit').value)
  };
  Array.from(document.querySelectorAll('#dynFields [data-key]')).forEach((el) => {
    payload[el.dataset.key] = el.value.trim();
  });
  if ($('f_ak').value.trim()) payload.ak = $('f_ak').value.trim();
  if ($('f_sk').value.trim()) payload.sk = $('f_sk').value.trim();

  $('btnSave').disabled = true;
  try {
    const res = await fetch(id ? '/api/accounts/' + id : '/api/accounts', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return toast(data.error || '保存失败（' + res.status + '）', 'err', 6000);

    toast(id ? '已保存' : '已新增，正在采集…', 'ok');
    $('formSection').style.display = 'none';
    await load().catch(() => {});
    if (!id) fetch('/api/collect', { method: 'POST' }).then(() => load().catch(() => {})).catch(() => {});
  } catch (err) {
    toast('保存失败：' + err.message, 'err', 6000);
  } finally {
    $('btnSave').disabled = false;
  }
}

async function testAccount(id) {
  toast('测试中…');
  try {
    const res = await fetch('/api/accounts/' + id + '/test', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok && !data.error) {
      toast('测试失败（' + res.status + '）', 'err', 6000);
    } else {
      const ok = data.ok === true;
      toast((ok ? '连通正常：' : '失败：') + (data.message || data.error || '无返回内容'), ok ? 'ok' : 'err', 8000);
    }
  } catch (e) {
    toast('测试请求失败：' + e.message, 'err', 6000);
  }
  load().catch(() => {});
}

async function toggleAccount(a) {
  try {
    await fetch('/api/accounts/' + a.id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: !a.enabled })
    });
  } catch (_) {}
  load().catch(() => {});
}

async function removeAccount(a) {
  if (!confirm('删除账号「' + a.name + '」？它的历史快照会一起删掉。')) return;
  try {
    const res = await fetch('/api/accounts/' + a.id, { method: 'DELETE' });
    if (!res.ok) return toast('删除失败（' + res.status + '）', 'err');
    toast('已删除');
  } catch (e) {
    return toast('删除失败：' + e.message, 'err');
  }
  load().catch(() => {});
}

async function saveSettings(e) {
  e.preventDefault();
  const num = (id) => {
    const v = $(id).value.trim();
    return v === '' ? undefined : Number(v);
  };
  const payload = {
    collect_interval_min: num('s_interval'),
    warn_remaining_pct: num('s_warn'),
    crit_remaining_pct: num('s_crit'),
    keep_days: num('s_keep')
  };
  try {
    const res = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) return toast(data.error || '保存失败', 'err', 6000);
    toast('设置已保存', 'ok');
    load().catch(() => {});
  } catch (err) {
    toast('保存失败：' + err.message, 'err', 6000);
  }
}

/* ---------------------------------------------------------------- 事件 */

$('btnAdd').onclick = () => openForm(null);
$('btnCancel').onclick = () => { $('formSection').style.display = 'none'; };
$('accountForm').onsubmit = saveAccount;
$('settingsForm').onsubmit = saveSettings;
/* 换厂商时区域之类的输入框跟着换，已经填的值不带到另一家去 */
$('f_provider').onchange = () => renderProviderFields($('f_provider').value, null);

$('btnRefresh').onclick = () =>
  load().then(() => toast('已刷新')).catch((e) => toast('刷新失败：' + e.message, 'err', 6000));

$('btnCollect').onclick = async () => {
  const btn = $('btnCollect');
  btn.disabled = true;
  toast('采集中…');
  try {
    const res = await fetch('/api/collect', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      toast('采集失败：' + (data.error || res.status), 'err', 8000);
    } else {
      const r = data.result || {};
      const fails = r.failures || [];
      const notes = r.notices || [];
      if (r.skipped) toast('已有采集任务在跑，本次跳过', '', 4000);
      else if (fails.length) toast('采集完成，失败：' + fails.join('；'), 'err', 12000);
      else if (notes.length) toast('采集完成 ' + (r.itemCount || 0) + ' 项；有告警：' + notes.join('；'), '', 12000);
      else toast('采集完成，' + (r.itemCount || 0) + ' 项', 'ok');
    }
  } catch (e) {
    toast('采集失败：' + e.message, 'err', 8000);
  } finally {
    btn.disabled = false;
    load().catch(() => {});
  }
};

/* 定时刷新只刷新数据，不动表单里的输入 —— load() 里不碰 formSection 的输入值 */
load().catch((e) => toast('加载失败：' + e.message, 'err', 8000));
setInterval(() => {
  if (document.hidden) return;
  load().catch(() => {});
}, 60000);
</script>
