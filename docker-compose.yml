# 流量面板
#   docker compose up -d --build      启动
#   docker compose logs -f            看日志
#   docker compose down               停止（数据留在 ./data）
#
# 只给内网用：面板和 /pull 都无鉴权，不要把这个端口映射到公网。

services:
  flow-panel:
    build: .
    image: flow-panel:latest
    container_name: flow-panel
    restart: unless-stopped
    init: true

    ports:
      - "15551:15551"

    volumes:
      # 数据都在这里：panel.db + master.key，备份就备份这个目录。
      # 目录不存在时由 docker 创建（属主 root），entrypoint 启动时会改成 node，无需手动处理。
      - ./data:/data

    environment:
      TZ: Asia/Shanghai
      PORT: "15551"
      # 主密钥（openssl rand -base64 32）。
      # 留空则首次启动自动生成到 ./data/master.key —— 那个文件要备份且不能丢，
      # 丢了已存的 AK/SK 就解不开了，只能重新录入。
      MASTER_KEY: ${MASTER_KEY:-}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
